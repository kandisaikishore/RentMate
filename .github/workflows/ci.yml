name: RentMate CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Next.js project structure
        run: |
          set -eu
          if [ -d app ] || [ -d pages ] || [ -d src/app ] || [ -d src/pages ]; then
            pnpm run build
          else
            echo "No Next.js app/pages source directory exists in this repository."
            echo "Failing build is expected until the actual application source is committed."
            exit 1
          fi
