name: RentMate CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate repository structure
        shell: bash
        run: |
          set -eu
          if [ -d app ] || [ -d pages ] || [ -d src/app ] || [ -d src/pages ]; then
            pnpm run build
          elif find . -path './node_modules' -prune -o \( -name '*.tsx' -o -name '*.ts' \) -type f -print -quit | grep -q .; then
            echo "TypeScript source files found; run the project compiler."
            pnpm exec tsc --noEmit --pretty false
          else
            echo "::warning::No app/pages/TypeScript source files are checked in. Dependency install succeeded, but application build is blocked until source files are added."
            test -f package.json
          fi
